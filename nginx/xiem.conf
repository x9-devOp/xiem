# /etc/nginx/sites-enabled/xiem

upstream flask_app {
    server 127.0.0.1:5000;
}

# 1) HTTP → HTTPS
server {
    listen      80;
    server_name xiem.x9.cz;
    # rovnou presmerovat na stejnou URI, ale s HTTPS
    return 301 https://$host$request_uri;
}

# 2) HTTPS server block
server {
    listen      443 ssl http2;
    server_name xiem.x9.cz;

    # --- SSL certifikaty (Certbot je spravuje) ---
    ssl_certificate      /etc/letsencrypt/live/xiem.x9.cz/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/xiem.x9.cz/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    # --- Reverzni proxy na Flask app ---
    location / {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # --- Servirovani statickych souboru IP_LISTS ---
    location /IP_LISTS/ {
        alias     /var/www/html/IP_LISTS/;
        autoindex on;
        try_files $uri =404;
    }
}
